# dsh-forge bundle patch
#
# 只做两件事：插入插件行 + 给默认 config。零源码补丁。
#
# 层开关（默认值来自 core/hooks.js 的 LAYERS.defaultOn）：
#   L1  system prompt     开
#   L1b runtime context   开   ← complete:true 预设下唯一稳的注入面
#   L2  user message      关
#   L3  assistant 历史    关   ← 改动历史会破坏前缀缓存
#
# L0 是「基座」不是层：宿主权限相关的一切都在 l0.capabilities 里，默认全关。
# 每项能力都声明成本等级，成本越高闸越多：
#   native        走官方扩展点，运行时即可开合
#   env           进程环境变量，可还原
#   filesystem    本机文件/计划任务，必须带 --destructive 且只能走 CLI
#   source-patch  改宿主源码，必须同时开 l0.sourcePatch.enabled 且只能走 CLI
#
# 宿主运行时只自动应用 native / env 两类；filesystem 与 source-patch 永不自动执行。

- insert:
    - id: dsh-forge
      name: dsh-forge
      config:
        enabled: true
        verbose: false

        # 提示词来源：空 = 用插件自带 prompts/base.md
        promptFile: ""
        # 注入段在 sections 里的排序。官方 HARNESS_IDENTITY 是 -1000，故默认 -1001。
        promptOrder: -1001
        # 从 sections 里剔除的段名（数组）。留空数组 = 不改身份。
        stripSections:
          - harness:identity

        # 额外中间件目录：空 = 插件自带 mods/。写成绝对路径可放自己的。
        modsDir: ""

        layers:
          L1: true
          L1b: true
          L2: false
          L3: false

        l0:
          # 只读嗅探宿主策略（sandbox mode / approval policy），结果喂给状态页
          readOnly: true

          # 源码补丁总闸。开着也不代表会自动打 —— 还要 CLI 显式执行。
          sourcePatch:
            enabled: false

          # 统一能力开关。默认全关，按需要逐项打开。
          # 每项的成本与还原方式见 `node scripts/forge.mjs cap list`。
          capabilities:
            auto-approve: false               # native  approval/request → allowed-once
            scrub-permission-env: false        # env     清除 DSH_PERMISSION_MODE
            remove-doctor-supervisor: false    # fs      移除 Doctor 守护脚本+计划任务（带备份）
            suppress-host-crash: false         # patch   宿主退出静默（补丁待填）
            escalation-ladder-bypass: false    # patch   escalation 加宽阶梯豁免

        # 自更新：绑 GitHub 仓库。sha256 为空时只允许 check，apply 会被拒绝。
        update:
          repo: ZH-TX3/dsh-forge
          ref: main
          sha256: ""

        # 单条中间件覆盖开关，例：{ "mod:my-rule": false }
        middleware: {}
