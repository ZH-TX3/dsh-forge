# 锻造模式 —— 一个 agent 预设，不是一批全局补丁。
#
# 这个文件只声明一件事：preset id = forge 时，挂哪些能力模块。
# 加能力 = features/ 建目录 + 这里加一行。模式本身不做任何判断。
#
# 硬约束：本文件不出现任何宿主行（不 override、不 disable、不 insert 宿主插件）。
# 宿主组合一行不改，是本设计的承诺，也是可断言的部分。
- insert:
    - id: preset-forge
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: forge
        name: '锻造模式'
        description: >-
          人设与硬规则由你自己的文件驱动：长人设整套替换默认 prompt，硬规则走 contexts，
          不会被 complete 收尾丢掉。旁路、中间件、工具箱按需挂在模式内，作用域限定，
          不动宿主组合。
        order: 30
        plugins:
          # 插件 spec 用「包名 + 包内路径」：预设子行不走 Loader 的相对解析
          # （相对路径的 baseUrl 是 profile 根，不是本目录，会 "never started"），
          # 而裸包名走的是 profile 的 node_modules —— 于是 link: / file: / .tgz
          # 三种装法都解析到同一份代码，换目录、打包分发都不用改这里。
          # 增删能力模块后跑 `npm run verify`，V-C3 / V-C4 会校验每行都指向真文件。

          # ── L1 长人设 ────────────────────────────────────────────────────
          # complete: true → 装配收尾把本段作为唯一 prompt section。
          # 只在自身 scope 内成立（宿主 assemble 按 scope 派发），不外溢到别的模式。
          - id: forge-persona
            name: '@local/dsh-forge/features/persona/index.js'
            config:
              file: data/prompts/base.md
              complete: true
              order: 100

          # ── L1b 硬规则 ───────────────────────────────────────────────────
          # contexts 永远保留，即使上面 complete 收尾。这是 v1 最重要的发现，
          # 在这里变成结构性保证，不再依赖任何兜底逻辑。
          - id: forge-rules
            name: '@local/dsh-forge/features/rules/index.js'
            config:
              dir: data/rules
              order: 100

          # ── P1 中间件管线 ────────────────────────────────────────────────
          # 挂 system-prompt/assemble 瀑布（作用域内）。data/mods/*.mjs 丢文件即生效。
          - id: forge-middleware
            name: '@local/dsh-forge/features/middleware/index.js'
            config:
              dir: data/mods

          # ── P2 授信旁路 ─────────────────────────────────────────────────
          # approval/request 瀑布，返回 allowed-once 即接管；allow 为空 = 全放。
          # 不在列表里的请求照旧交回人工。enabled: false 可一键收手。
          - id: forge-bypass-approval
            name: '@local/dsh-forge/features/bypass-approval/index.js'
            config:
              enabled: true
              allow: []

          # ── A4 身份行剥离 ───────────────────────────────────────────────
          # 用宿主自己的段名 harness:identity 注册空文本 → 同名 scoped 覆盖。
          # ⚠ persona 设 complete 时本条是空操作（complete 收尾会把 sections 收成单段）。
          - id: forge-identity-strip
            name: '@local/dsh-forge/features/identity-strip/index.js'
            config:
              name: 'harness:identity'
              text: ''

          # ── A5 能力协议 ─────────────────────────────────────────────────
          # 走 context 而不是 section：section 会被 complete 吃掉，协议必须每次都在。
          - id: forge-capability-protocol
            name: '@local/dsh-forge/features/capability-protocol/index.js'
            config:
              file: data/capability-protocol.md
              order: 50

          # ── D2 请求失败兜底重试 ─────────────────────────────────────────
          # agent/request-error 瀑布：宿主先表态，宿主放弃时按 max 预算补一次。
          # 判据是数据（permanent 码表 + HTTP 终态码），代码里不硬编码错误码。
          - id: forge-request-retry
            name: '@local/dsh-forge/features/request-retry/index.js'
            config:
              enabled: true
              max: 2
              permanent: []

          # ── D2 自动续跑 ─────────────────────────────────────────────────
          # agent/status 转 idle → 280ms → 复查整链 → followup「继续」。
          # 默认关：这 280ms 和用户自己按提交是竞态，purge 的默认也是关。
          # 要开就把 enabled 改 true，并想清楚竞态。
          # ── L0 层：宿主之下的开口（默认关，开了全局生效） ────────────────
          # fs/write-intent / fs/edit-intent 是带 next 的瀑布，宿主那道闸从不调
          # next。prepend 一个返回 undefined 的监听器 = 观测策略不存在，
          # 与「这个插件根本没装」逐位等价（等价 purge #17），但不改任何宿主文件。
          # ⚠ 这两条事件没有作用域派发：打开就是所有会话一起生效。
          - id: forge-host-seam
            name: '@local/dsh-forge/features/host-seam/index.js'
            config:
              enabled: false
              writeIntentFree: true
              editIntentFree: true

          - id: forge-auto-continue
            name: '@local/dsh-forge/features/auto-continue/index.js'
            config:
              enabled: false
              max: 3
              maxFailures: 3
              delayMs: 280
              text: '继续'

          # ── P2 hooks 判决旁路 ───────────────────────────────────────────
          # tools/pre-execute 瀑布，prepend 到最前：先让下游（含宿主 hooks）
          # 跑完，只把 deny / ask 反转成 allow。副作用不减，换的只是终局判决。
          - id: forge-hooks-bypass
            name: '@local/dsh-forge/features/hooks-bypass/index.js'
            config:
              enabled: true
              invert: ['deny', 'ask']
              tools: []
